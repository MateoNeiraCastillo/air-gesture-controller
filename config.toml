# Air Gesture Controller configuration.
# Every value is validated at startup: if anything is out of range, the
# program refuses to start and tells you which line to fix.

[calibration]
# VALID frames (hand detected) collected for each pose.
# 90 frames ≈ 3 s at 30 fps, same as in the spike.
frames_per_pose = 90
# Minimum separation between two poses (e.g. rest vs A pressed), measured in
# standard deviations of the pose itself. Below this, the calibration is
# rejected and you are asked to repeat it: you pressed too lightly or your hand moved.
min_separation = 3.0

[classifier]
# The D-pad counts as pressed once the thumb has travelled this fraction of
# the way between rest and the calibrated direction. 0.5 = halfway.
# Lower: more sensitive, but more accidental presses.
# 0.3 measured with the spike: in the daytime `combo` the thumb only covered
# ~50 % of the calibrated travel (0.5 got 49 % right, 0.3 got 98 %), and at rest
# the thumb rarely goes past 0.2. The state machine filters out flickers.
dpad_threshold = 0.3

[posture]
# If the apparent hand size drifts from the calibration beyond these limits
# (because the hand has rotated or you moved closer or further away), a warning is shown.
hand_size_ratio_min = 0.7
hand_size_ratio_max = 1.4
# Continuous time out of range before warning: a single odd frame should not trigger it.
warning_after_ms = 500

[timing]
# How long a button must be seen pressed before the key is sent.
# In practice this rounds to frames: it requires seeing the button in 2 consecutive frames.
# Measured in the guided session (loop at ~15 fps): without confirmation (0)
# ghost presses slip through (exact taps 78 %); with 40, 60 or 80 ms the accuracy
# is the same (100 %) and the delay is set by the frame rate. 40 gives less
# delay once the loop runs faster.
press_confirm_ms = 40
# How long it must be seen released before the key is released.
release_confirm_ms = 40
# Time without seeing a hand before releasing its buttons. Covers detection
# flickers (~2-5 % of frames in the spike) without leaving keys stuck.
missing_hand_ms = 200

[keys]
# Key sent by each button by default (Chrome dino, SuperTuxKart...).
left = "left"
right = "right"
a = "up"
# B: tilt the right thumb outwards. Down: duck in the dino game, brake in SuperTuxKart.
b = "down"

# Per-game profiles: only the listed keys change; the rest come from [keys].
# Usage: python scripts/play.py --game celeste
[games.celeste]
# Celeste Classic (PICO-8, browser): arrows to move, C (or Z) jumps, X dashes.
a = "c"
b = "x"
