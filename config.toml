# Configuración del Air Gesture Controller.
# Todos los valores se validan al arrancar: si algo está fuera de rango,
# el programa no arranca y te dice qué línea corregir.

[calibration]
# Frames VÁLIDOS (mano detectada) que se recogen por cada postura.
# 90 frames ≈ 3 s a 30 fps, lo mismo que en el spike.
frames_per_pose = 90
# Separación mínima entre dos posturas (p. ej. reposo vs A pulsado), medida en
# desviaciones típicas de la propia postura. Por debajo, la calibración se
# rechaza y se pide repetir: pulsaste demasiado flojo o la mano se movió.
min_separation = 3.0

[classifier]
# La cruceta cuenta como pulsada cuando el pulgar ha recorrido esta fracción
# del camino entre reposo y la dirección calibrada. 0.5 = a mitad de camino.
# Más bajo: más sensible, pero más pulsaciones accidentales.
# 0.3 medido con el spike: en el `combo` de día el pulgar solo hacía ~50 % del
# recorrido calibrado (0.5 acertaba el 49 %, 0.3 el 98 %), y en reposo el
# pulgar rara vez pasa de 0.2. La máquina de estados filtra los parpadeos.
dpad_threshold = 0.3

[posture]
# Si el tamaño aparente de la mano se aleja de la calibración más allá de estos
# límites (porque la mano ha girado o te has acercado o alejado), se avisa.
hand_size_ratio_min = 0.7
hand_size_ratio_max = 1.4
# Tiempo seguido fuera de rango antes de avisar: un frame raro no debe saltar.
warning_after_ms = 500

[timing]
# Tiempo que un botón tiene que verse pulsado antes de enviar la tecla.
# En la práctica se redondea a frames: exige ver el botón en 2 frames seguidos.
# Medido en la sesión guiada (bucle a ~15 fps): sin confirmación (0) se cuelan
# pulsaciones fantasma (toques exactos 78 %); con 40, 60 u 80 ms el acierto es
# el mismo (100 %) y el retraso lo marca el ritmo de frames. 40 da menos
# retraso en cuanto el bucle vaya más rápido.
press_confirm_ms = 40
# Tiempo que tiene que verse soltado antes de soltar la tecla.
release_confirm_ms = 40
# Tiempo sin ver una mano antes de soltar sus botones. Cubre los parpadeos de
# detección (~2-5 % de frames en el spike) sin dejar teclas pegadas.
missing_hand_ms = 200

[keys]
# Tecla que envía cada botón por defecto (dino de Chrome, SuperTuxKart...).
left = "left"
right = "right"
a = "up"

# Perfiles por juego: solo cambian las teclas indicadas; el resto se toma de [keys].
# Uso: python scripts/play.py --game celeste
[games.celeste]
# Celeste Classic (PICO-8, navegador): flechas para moverse, C (o Z) salta, X hace dash.
a = "c"
