# Air Gesture Controller configuration.
# Every value is validated at startup: if anything is out of range, the
# program refuses to start and tells you which line to fix.

[calibration]
# VALID frames (hand detected) collected for each pose.
# 90 frames ≈ 3 s at 30 fps, same as in the spike.
frames_per_pose = 90
# Minimum separation between two poses (e.g. rest vs A pressed), measured in
# standard deviations of the pose itself. Below this, the calibration is
# rejected and you are asked to repeat it: you pressed too lightly or your hand moved.
min_separation = 3.0

[classifier]
# The D-pad counts as pressed once the thumb has travelled this fraction of
# the way between rest and the calibrated direction. 0.5 = halfway.
# Lower: more sensitive, but more accidental presses.
# 0.3 measured with the spike: in the daytime `combo` the thumb only covered
# ~50 % of the calibrated travel (0.5 got 49 % right, 0.3 got 98 %), and at rest
# the thumb rarely goes past 0.2. The state machine filters out flickers.
dpad_threshold = 0.3
# Button A counts as pressed once the right thumb has moved this fraction of the
# calibrated travel past its current rest.
button_threshold = 0.4
# Button B: this fraction of the calibrated outward tilt...
b_threshold = 0.6
# ...and, if your calibrated B also lowers the thumb, this fraction of that
# lowering. A relaxed thumb wanders outwards without going down: with
# "outwards only" (0.4), 18 of 28 B presses in a real game were that wandering.
# With 0.6 and 0.4: 11 B presses, every real B shape still caught (11/11).
b_down_fraction = 0.4
# ...unless the tilt is this strong (1.2 of the calibrated one): then it counts
# on its own. On 06-11, strong dash attempts (up to 2.0) without lowering the
# thumb were all lost; the wandering thumb stays under ~0.9. This adds 1–5 B
# presses per game in the recorded games.
b_strong_threshold = 1.2
# Re-learn where the right thumb rests while you play (button A). In two
# Celeste games the relaxed thumb crept to 0.6–1.0 of the calibrated A press
# (the fist rolled, the thumb relaxed): A was "held" up to 81–94 % of the time.
# Re-learning the rest over the last 5 s kept it at 11–47 %. See
# air_controller/rest_tracker.py. 0 turns it off: do that for games where you
# hold A or B for seconds.
rest_window_ms = 5000
# The rest is this low percentile of the thumb's recent positions (presses are short).
rest_percentile = 20
# The rest never moves more than this fraction of the way to the calibrated press.
# Real presses go deeper than that (1.2–2.8 in those games), so they still count.
rest_max_shift = 0.8

[posture]
# If the apparent hand size drifts from the calibration beyond these limits
# (because the hand has rotated or you moved closer or further away), a warning is shown.
hand_size_ratio_min = 0.7
hand_size_ratio_max = 1.4
# Continuous time out of range before warning: a single odd frame should not trigger it.
warning_after_ms = 500

[timing]
# How long a button must be seen pressed before the key is sent.
# In practice this rounds to frames: it requires seeing the button in 2 consecutive frames.
# Measured in the guided session (loop at ~15 fps): without confirmation (0)
# ghost presses slip through (exact taps 78 %); with 40, 60 or 80 ms the accuracy
# is the same (100 %) and the delay is set by the frame rate. 40 gives less
# delay once the loop runs faster.
press_confirm_ms = 40
# How long it must be seen released before the key is released.
release_confirm_ms = 40
# Time without seeing a hand before releasing its buttons. Covers detection
# flickers (~2-5 % of frames in the spike) without leaving keys stuck.
missing_hand_ms = 200

[keys]
# Keys sent by default: Subway Surfers (left/right change lane, up jumps, down
# rolls). The same keys work in the Chrome dino and in Tetris (Jstris).
left = "left"
right = "right"
a = "up"
# B: tilt the right thumb outwards.
b = "down"

# Per-game profiles: only the listed keys change; the rest come from [keys].
# Usage: python scripts/play.py --game celeste
# A profile can also set rest_window_ms (see [classifier]), e.g. rest_window_ms = 0
# for a game where you hold A or B for more than ~4 s, like an accelerator.
[games.celeste]
# Celeste Classic (PICO-8, browser): arrows to move, C (or Z) jumps, X dashes.
# On hold: its first level (100 m) needs a dash up or up-right, and the D-pad
# has no "up" yet. Kept as an example of a profile.
a = "c"
b = "x"
